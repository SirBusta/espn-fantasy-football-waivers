name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Docs, the Unraid template and the icon aren't part of the image.
    paths-ignore:
      - '**.md'
      - 'templates/**'
      - 'assets/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  # Pushes to main publish "edge"; a tag vX.Y.Z publishes X.Y.Z and "latest",
  # which is what the Unraid template uses.
  image:
    name: Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sirbusta/espn-fantasy-football-waivers
    steps:
      - uses: actions/checkout@v6

      - name: Work out tags
        id: tags
        run: |
          VERSION=$(cat VERSION)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file (${VERSION}): expected v${VERSION}."
              exit 1
            fi
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          # Docker-format manifest list, no attestations: ghcr.io answers an
          # update check that only accepts Docker formats (Unraid's) with 404
          # for an OCI index, so Unraid would never see a new version.
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=espn-fantasy-football-waivers
            org.opencontainers.image.description=Emails your ESPN fantasy football league's waiver results
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
